# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "lumark"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Lumark - A fast, cross-platform Markdown reader"
vendor: "Lumark Team"
homepage: "https://github.com/yahya-mehrabani/Lumark"
license: "MIT"
release: "1"

contents:
  - src: "./bin/lumark"
    dst: "/usr/bin/lumark"
  - src: "./packaging/linux/lumark.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/lumark.svg"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/lumark.png"
  - src: "./build/linux/lumark.desktop"
    dst: "/usr/share/applications/lumark.desktop"

# Default dependencies for Ubuntu 24.04+ (GTK4 + WebKitGTK 6.0 with GTK3/WebKit2GTK 4.1 fallback)
depends:
  - libc6 (>= 2.38)
  - libgtk-4-1 (>= 4.12.0) | libgtk-3-0 (>= 3.24.0)
  - libwebkitgtk-6.0-4 (>= 2.40.0) | libwebkit2gtk-4.1-0 (>= 2.40.0)

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop and MIME database is updated after install/removal
scripts:
  postinstall: "./packaging/linux/debian/postinst"
  preremove: "./packaging/linux/debian/prerm"
  postremove: "./packaging/linux/debian/postrm"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
