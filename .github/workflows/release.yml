name: Release & Multi-Platform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (Debian & AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config desktop-file-utils

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

      - name: Build Wails App
        run: wails3 build

      - name: Build Debian Package
        run: |
          ./packaging/linux/build-deb.sh

      - name: Build AppImage Pipeline
        run: |
          ./packaging/linux/build-appimage.sh

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            build/bin/*.deb
            build/bin/*.AppImage
            build/bin/*.AppDir.tar.gz
          if-no-files-found: warn

  build-windows:
    name: Build Windows Package (NSIS Installer)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

      - name: Set up NSIS
        uses: nsis-dev/setup-nsis@v1

      - name: Build Wails App
        run: wails3 build

      - name: Build NSIS Installer
        shell: bash
        run: |
          makensis packaging/windows/installer.nsi

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: bin/markdown-viewer-installer.exe
          if-no-files-found: warn

  build-macos:
    name: Build macOS Package (DMG & App Bundle)
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

      - name: Install go-task and create-dmg
        run: brew install go-task create-dmg

      - name: Package Application Bundle
        run: |
          task darwin:package APP_NAME=Lumark

      - name: Build DMG Package
        run: |
          ./packaging/macos/create-dmg.sh bin "Lumark"

      - name: Create Zip of Application Bundle
        run: |
          cd bin
          ditto -c -k --sequesterRsrc --keepParent "Lumark.app" "Lumark-macos.zip"

      - name: Upload macOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            bin/Lumark.dmg
            bin/Lumark-macos.zip
          if-no-files-found: warn

  publish-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

