name: Linux Build & Packaging

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Build Ubuntu 24.04 Debian Package & AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev desktop-file-utils

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

      - name: Verify Wails CLI
        run: wails3 version

      - name: Build Application Binary
        run: |
          mkdir -p bin
          go build -tags production -trimpath -ldflags="-w -s" -o bin/markdown-viewer .

      - name: Build Debian Package
        run: |
          ./packaging/linux/build-deb.sh

      - name: Validate Desktop Entry Specification
        run: |
          desktop-file-validate packaging/linux/markdown-viewer.desktop
          python3 scripts/validate_desktop_file.py

      - name: Run Package Verification Suite
        run: |
          npm run test:package:linux

      - name: Build AppImage Pipeline
        run: |
          ./packaging/linux/build-appimage.sh

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-viewer-debian-package
          path: build/bin/markdown-viewer*.deb
          if-no-files-found: warn

      - name: Upload AppImage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markdown-viewer-appimage
          path: |
            build/bin/markdown-viewer*.AppImage
            build/bin/markdown-viewer*.tar.gz
          if-no-files-found: warn
