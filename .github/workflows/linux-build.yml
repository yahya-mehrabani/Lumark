name: Linux Build & Packaging

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Build Ubuntu 24.04 Debian Package & AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config desktop-file-utils

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

      - name: Verify Wails CLI
        run: wails3 version

      - name: Build Wails App
        run: wails3 build

      - name: Build Debian Package
        run: |
          ./packaging/linux/build-deb.sh

      - name: Validate Desktop Entry Specification
        run: |
          desktop-file-validate packaging/linux/lumark.desktop
          desktop-file-validate build/linux/lumark.desktop
          python3 scripts/validate_desktop_file.py

      - name: Run Package Verification Suite
        run: |
          npm run test:package:linux

      - name: Install appimagetool
        run: |
          curl -sSL -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          cd /tmp && ./appimagetool --appimage-extract
          sudo rm -rf /usr/local/lib/appimagetool
          sudo mv /tmp/squashfs-root /usr/local/lib/appimagetool
          sudo chmod -R 755 /usr/local/lib/appimagetool
          sudo ln -sf /usr/local/lib/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version

      - name: Build AppImage Pipeline
        run: |
          ./packaging/linux/build-appimage.sh

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumark-debian-package
          path: |
            build/bin/lumark*.deb
          if-no-files-found: warn

      - name: Upload AppImage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumark-appimage
          path: |
            build/bin/Lumark*.AppImage
            build/bin/Lumark*.tar.gz
          if-no-files-found: warn
